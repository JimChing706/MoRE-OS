name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: more_core/pyproject.toml

      - name: Install dependencies
        working-directory: more_core
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Lint (ruff)
        working-directory: more_core
        run: python -m ruff check more_core/ tests/

      - name: Format check (ruff)
        working-directory: more_core
        run: python -m ruff format --check more_core/ tests/

      - name: Type check (mypy)
        working-directory: more_core
        run: python -m mypy more_core/ || true

      - name: Run tests
        working-directory: more_core
        run: python -m pytest tests/ -v --tb=short

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        working-directory: more_core
        run: |
          pip install coverage
          python -m pytest tests/ --cov=more_core --cov-report=xml
          # Upload to GitHub Artifacts for now (codecov can be added later)

  frontend-test:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Lint (eslint)
        working-directory: app
        run: npm run lint

      - name: Type check (tsc)
        working-directory: app
        run: npx tsc -b --noEmit

      - name: Run tests (vitest)
        working-directory: app
        run: npm test

      - name: Build
        working-directory: app
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: app/dist/

  layer-gate:
    name: Layer Matrix Gate (L0-L5)
    # 快速反馈门禁（约 1s）：把分层综合测试矩阵与"自演进/自修改故障隔离"
    # 固化为 PR 必跑检查，防止 L2/L5 的包含式降级被回退。
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: more_core/pyproject.toml

      - name: Install dependencies
        working-directory: more_core
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: L0-L5 分层综合测试矩阵
        working-directory: more_core
        run: python -m pytest tests/test_layer_matrix_l0_l5.py -q --tb=short

      - name: 分层权威链路回顾性检验
        working-directory: more_core
        run: python -m pytest tests/test_layer_matrix_retrospective.py -q --tb=short

      - name: 自演进/自修改故障隔离回归 (L2/L5)
        working-directory: more_core
        run: python -m pytest tests/ -m fault_isolation -q --tb=short

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [python-test, frontend-test, layer-gate]

    steps:
      - uses: actions/checkout@v4

      - name: Build frontend Docker image
        working-directory: app
        run: docker build -t more-console .

      - name: Scan image vulnerabilities (trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: more-console
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
