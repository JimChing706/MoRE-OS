# ---------------------------------------------------------------------------
# MoRE OS nginx canary upstream configuration
#   - Include this file from your global nginx.conf via:
#         include /opt/more-core/deploy/canary/nginx/more_os_canary.conf;
#   - Weights are controlled by `deploy/canary/scripts/more-rollout.sh`
#     (sed edits on STABLE_WEIGHT_TOKEN / CANARY_WEIGHT_TOKEN placeholders).
#   - Always run `nginx -t` before `nginx -s reload`.
# ---------------------------------------------------------------------------

# -------- upstream: Python FastAPI (stable + canary, weighted round-robin) --
upstream more_core_backend {
    zone more_core_backend_zone 64k;
    # ── tokens rewritten by more-rollout.sh ──────────────────────────────
    server 127.0.0.1:8765 weight=__STABLE_WEIGHT__ max_fails=3 fail_timeout=30s;
    server 127.0.0.1:8766 weight=__CANARY_WEIGHT__ max_fails=3 fail_timeout=30s backup;
    # ─────────────────────────────────────────────────────────────────────
    keepalive 64;
}

# -------- upstream: Rust BaiLongma Chassis (single instance, no canary yet)
upstream bailongma_chassis {
    zone bailongma_chassis_zone 32k;
    server 127.0.0.1:9988 max_fails=3 fail_timeout=30s;
    keepalive 128;
}

# -------- MoRE OS public virtual server ------------------------------------
server {
    listen       80;
    listen       [::]:80;
    server_name  __SERVER_NAME__;

    # 10 MiB body max (large codegen context payloads)
    client_max_body_size 10m;

    # timeouts aligned with effective_deadline max(90s) + 5s slack
    proxy_connect_timeout 10s;
    proxy_send_timeout    95s;
    proxy_read_timeout    95s;
    send_timeout          95s;

    # Real IP / request ID passthrough
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id      $request_id;

    # ---- A2A / LLM RPC bypass chassis directly when path contains /a2a -
    location ~ ^/api/v1/a2a($|/) {
        proxy_pass         http://bailongma_chassis;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
    }

    # ---- Health (no auth) ----------------------------------------------
    location = /api/v1/health {
        proxy_pass         http://more_core_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
    }

    # ---- Evolution summary (public panel) ------------------------------
    location = /api/v1/evolution/summary {
        proxy_pass         http://more_core_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
    }

    # ---- All remaining /api/v1/* -> weighted stable/canary -------------
    location /api/v1/ {
        proxy_pass         http://more_core_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";

        # 5xx from canary -> silently retry on stable (canary is backup too)
        proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # ---- /health convenience alias for LB probes -----------------------
    location = /health {
        access_log off;
        return 200 "more-os-nginx-ok\n";
        add_header Content-Type text/plain;
    }
}
