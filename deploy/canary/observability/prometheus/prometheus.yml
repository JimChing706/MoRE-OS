global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: more-os-single-node
    environment: canary
rule_files:
- /Users/qnming/AI_Cample/qnm-os-prev-202605211332/deploy/canary/observability/prometheus/alert_rules.yml
alerting:
  alertmanagers:
  - static_configs:
    - targets: []
scrape_configs:
- job_name: prometheus-self
  static_configs:
