<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>扫雷 - MoRE OS Plugin</title>
    <link rel="stylesheet" href="/static/minesweeper.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 扫雷游戏</h1>
            <p class="subtitle">MoRE OS Autonomous Plugin</p>
        </header>

        <div class="controls">
            <div class="control-group">
                <label for="difficulty">难度:</label>
                <select id="difficulty">
                    <option value="beginner">初级 (9×9, 10雷)</option>
                    <option value="intermediate">中级 (16×16, 40雷)</option>
                    <option value="expert">高级 (30×16, 99雷)</option>
                </select>
                <button id="newGameBtn" class="btn btn-primary">新游戏</button>
            </div>

            <div class="stats">
                <div class="stat">
                    <span class="label">剩余雷:</span>
                    <span id="minesLeft">--</span>
                </div>
                <div class="stat">
                    <span class="label">时间:</span>
                    <span id="timer">00:00</span>
                </div>
                <div class="stat">
                    <span class="label">状态:</span>
                    <span id="status">准备</span>
                </div>
            </div>
        </div>

        <div class="game-area">
            <div id="gameBoard" class="game-board"></div>
        </div>

        <div class="ai-panel">
            <h3>🤖 AI 自动游玩</h3>
            <div class="ai-controls">
                <button id="autoPlayBtn" class="btn btn-ai">开始自动</button>
                <button id="stopBtn" class="btn btn-danger">停止</button>
                <label>
                    <input type="checkbox" id="showThinking" checked> 显示思考
                </label>
            </div>
            <div id="aiLog" class="ai-log"></div>
        </div>

        <div class="info">
            <h4>操作说明</h4>
            <ul>
                <li><strong>左键点击</strong>: 翻开格子</li>
                <li><strong>右键点击</strong>: 标记/取消标记地雷</li>
                <li><strong>双键点击</strong>: 快速翻开(当数字周围标记数足够时)</li>
            </ul>
        </div>
    </div>

    <script src="/static/minesweeper.js"></script>
</body>
</html>
