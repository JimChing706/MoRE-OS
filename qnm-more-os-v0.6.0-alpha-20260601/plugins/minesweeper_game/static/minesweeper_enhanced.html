<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a237e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    <title>扫雷 - 跨平台游戏</title>
    <link rel="stylesheet" href="/static/minesweeper_enhanced.css">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💣</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💣</text></svg>">
</head>
<body>
    <div id="app">
        <div class="app-header">
            <div class="platform-badge" id="platformBadge"></div>
            <h1>💎 跨平台扫雷</h1>
            <div class="app-subtitle">Multi-Platform Minesweeper</div>
        </div>

        <div class="game-stats">
            <div class="stat-item">
                <span class="stat-icon">⏱️</span>
                <span class="stat-value" id="timer">0</span>
                <span class="stat-label">秒</span>
            </div>
            <div class="stat-item">
                <span class="stat-icon">🚩</span>
                <span class="stat-value" id="flags">0</span>
                <span class="stat-label">标记</span>
            </div>
            <div class="stat-item">
                <span class="stat-icon">💎</span>
                <span class="stat-value" id="mines">10</span>
                <span class="stat-label">地雷</span>
            </div>
        </div>

        <div class="game-controls">
            <select id="difficulty" class="difficulty-select">
                <option value="small">📦 小型 (8×8, 8雷)</option>
                <option value="beginner">👶 初级 (9×9, 10雷)</option>
                <option value="medium">🏋️ 中级 (16×12, 32雷)</option>
                <option value="intermediate">🎯 进阶 (16×16, 40雷)</option>
                <option value="large">⚔️ 高级 (24×20, 80雷)</option>
                <option value="expert">🥷 资深 (30×16, 99雷)</option>
                <option value="huge">💥 极限 (30×24, 150雷)</option>
                <option value="custom">🎛️ 自定义...</option>
            </select>
            <button id="newGameBtn" class="btn-primary">🎮 新游戏</button>
            <button id="autoPlayBtn" class="btn-secondary">🤖 AI</button>
            <button id="stopBtn" class="btn-danger">⏹️ 停止</button>
        </div>

        <div class="platform-hints" id="platformHints">
            <div class="hint-item" id="touchHint">
                <span>📱 触摸操作</span>
                <small>点击翻开 · 长按标记 · 双击Chord</small>
            </div>
            <div class="hint-item" id="mouseHint" style="display:none;">
                <span>🖱️ 鼠标操作</span>
                <small>左键翻开 · 右键标记 · 中键/双键Chord</small>
            </div>
        </div>

        <div class="game-container">
            <div class="minesweeper-board" id="gameBoard"></div>
        </div>

        <div class="ai-panel" id="aiPanel" style="display:none;">
            <h4>🤖 AI 自动游玩</h4>
            <div class="ai-status" id="aiStatus">准备中...</div>
            <div class="ai-progress">
                <div class="ai-progress-bar">
                    <div class="ai-progress-fill" id="aiProgress"></div>
                </div>
            </div>
        </div>

        <div class="game-over-modal" id="gameOverModal" style="display:none;">
            <div class="modal-content">
                <div class="modal-icon" id="modalIcon"></div>
                <h2 id="modalTitle">游戏结束</h2>
                <p id="modalMessage">恭喜完成游戏！</p>
                <div class="modal-stats">
                    <div>用时: <span id="modalTime">0</span>秒</div>
                    <div>步数: <span id="modalMoves">0</span></div>
                    <div>准确率: <span id="modalAccuracy">100</span>%</div>
                </div>
                <button class="btn-primary" onclick="location.reload()">再来一局</button>
            </div>
        </div>
    </div>

    <script src="/static/minesweeper_enhanced.js"></script>
    <script>
        // 注册Service Worker用于PWA功能
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(err => {
                console.log('SW注册失败:', err);
            });
        }
    </script>
</body>
</html>
