# ============================================================
# MoRE v3.0 — Docker Compose 部署配置
# ============================================================

services:
  # 管理控制台
  more-console:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: more-v3-console
    ports:
      - "3080:80"
    restart: unless-stopped
    networks:
      - more-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Redis - 状态缓存
  redis:
    image: redis:7-alpine
    container_name: more-v3-redis
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    networks:
      - more-network
    volumes:
      - redis-data:/data

  # Prometheus - 监控
  prometheus:
    image: prom/prometheus:latest
    container_name: more-v3-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    networks:
      - more-network
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  # Grafana - 可视化
  grafana:
    image: grafana/grafana:latest
    container_name: more-v3-grafana
    ports:
      - "3001:3000"
    restart: unless-stopped
    networks:
      - more-network
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001

networks:
  more-network:
    driver: bridge

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
