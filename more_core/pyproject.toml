[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qnming-more-os"
dynamic = ["version"]
description = "QNMing MoRE OS — Neuro-Symbolic Metacognitive Self-Evolving Agent OS Kernel (L0–L5)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "QNMing MoRE Team" }]
keywords = ["agent", "llm", "platform", "neuro-symbolic", "metacognition", "self-improving"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "pydantic>=2.6,<4.0",
    "httpx>=0.27,<2.0",
    "anyio>=4.3,<6.0",
    "typing-extensions>=4.10",
    "python-dotenv>=1.0,<2.0",
    "PyYAML>=6.0,<8.0",
    "sympy>=1.13,<2.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<2.0",
]
redis = ["redis>=5.0,<7.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff==0.16.10",
    "mypy==2.4.0",
]
all = ["qnming-more-os[api,redis,dev]"]

[project.scripts]
more-os = "more_core.cli:main"
more-core = "more_core.cli:main"

[tool.setuptools.dynamic]
version = {attr = "more_core.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["more_core*"]
exclude = ["tests*", "examples*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# 规则集 = ruff 0.16.10 的**完整默认集（413 条）**，不再覆盖 select。
#
# 为什么不显式枚举：该集合多达 413 条，逐条抄写既冗长又容易与上游语义漂移；
# 可复现性由两件事共同保证 ——
#   ① ruff 版本钉死（dev 依赖 ruff==0.16.10，见下方 optional-dependencies.dev）；
#   ② CI 增加"规则集漂移守卫"步骤：把当时解析出的启用规则与
#      .ruff-rule-set-baseline.txt 逐行比对，任何漂移直接失败。
# 背景见 docs/audits/STAGE_ACCEPTANCE_2026-10-05.md §8.2（D-20 / RR-8）。

[tool.ruff.lint.per-file-ignores]
# cron 调度器的契约就是"本地朴素时间"，该用例固定用朴素 datetime 构造输入。
"tests/test_cron_scheduler.py" = ["DTZ001"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
