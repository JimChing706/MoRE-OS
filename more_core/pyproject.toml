[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qnming-more-os"
dynamic = ["version"]
description = "QNMing MoRE OS — Neuro-Symbolic Metacognitive Self-Evolving Agent OS Kernel (L0–L5)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "QNMing MoRE Team" }]
keywords = ["agent", "llm", "platform", "neuro-symbolic", "metacognition", "self-improving"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "pydantic>=2.6,<4.0",
    "httpx>=0.27,<2.0",
    "anyio>=4.3,<6.0",
    "typing-extensions>=4.10",
    "python-dotenv>=1.0,<2.0",
    "PyYAML>=6.0,<8.0",
    "sympy>=1.13,<2.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<2.0",
]
redis = ["redis>=5.0,<7.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff==0.16.10",
    "mypy>=1.9",
]
all = ["qnming-more-os[api,redis,dev]"]

[project.scripts]
more-os = "more_core.cli:main"
more-core = "more_core.cli:main"

[tool.setuptools.dynamic]
version = {attr = "more_core.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["more_core*"]
exclude = ["tests*", "examples*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# 显式声明规则集，而不是依赖 ruff 的"版本相关默认值"。
# 背景（D-20）：ruff 0.16.x 起默认规则集显著扩大 —— 同一份代码在 0.15.16 下 0 项，
# 在 0.16.10 下 1109 项（BLE001 338 / I001 246 / UP037 106 / S110 73 / ...）。
# 若不显式声明，CI 门禁会随"装到哪个 ruff 版本"漂移，结果不可复现。
# 更严格规则（I001/UP/SIM/RUF/BLE/DTZ…）的收编列为独立专项，
# 见 docs/audits/STAGE_ACCEPTANCE_2026-10-05.md §8.2（D-20）。
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
